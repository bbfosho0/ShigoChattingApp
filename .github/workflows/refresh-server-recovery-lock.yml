name: Refresh secure recovery server lockfile

on:
  push:
    branches:
      - secure-password-recovery
    paths:
      - .github/workflows/refresh-server-recovery-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: secure-password-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Upgrade Nodemailer to patched release
        working-directory: server
        run: npm install --package-lock-only --save nodemailer@9.0.5
      - name: Commit package metadata
        run: |
          if git diff --quiet -- server/package.json server/package-lock.json; then
            echo "No package metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          git commit -m "build: upgrade nodemailer security fixes"
          git push origin HEAD:secure-password-recovery
