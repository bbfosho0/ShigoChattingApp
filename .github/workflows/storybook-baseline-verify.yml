name: Verify Storybook TypeScript baseline

on:
  push:
    branches:
      - storybook-typescript-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Refresh root lockfile
        run: npm install --package-lock-only

      - name: Refresh client lockfile and dependencies
        working-directory: client
        run: |
          npm install
          npm audit fix || true

      - name: Refresh server lockfile and dependencies
        working-directory: server
        run: |
          npm install
          npm audit fix || true

      - name: Commit npm-generated lockfiles
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json client/package-lock.json server/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh hardened lockfiles"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Audit client dependency tree
        working-directory: client
        continue-on-error: true
        run: npm audit --json > client-audit-full.json || true

      - name: Audit server production dependency tree
        working-directory: server
        continue-on-error: true
        run: npm audit --omit=dev --json > server-audit-production.json || true

      - name: Run client regression tests
        working-directory: client
        run: npm test -- --watchAll=false --runInBand

      - name: TypeScript check
        working-directory: client
        run: npx tsc --noEmit

      - name: Build application
        working-directory: client
        run: npm run build

      - name: Build Storybook
        working-directory: client
        run: npm run build-storybook

      - name: Check server JavaScript syntax
        working-directory: server
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/messages.js
          node --check middleware/auth.js
          node --check middleware/validators.js
          node --check models/User.js
          node --check models/Message.js
