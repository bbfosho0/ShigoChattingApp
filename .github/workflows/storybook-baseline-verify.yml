name: Verify Storybook TypeScript baseline

on:
  push:
    branches:
      - storybook-typescript-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Refresh root lockfile
        run: npm install --package-lock-only

      - name: Refresh client lockfile and dependencies
        working-directory: client
        run: npm install

      - name: Refresh server lockfile and dependencies
        working-directory: server
        run: npm install

      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: hardened-lockfiles
          path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit client dependency tree
        working-directory: client
        continue-on-error: true
        run: npm audit --json > client-audit-full.json || true

      - name: Audit server production dependency tree
        working-directory: server
        continue-on-error: true
        run: npm audit --omit=dev --json > server-audit-production.json || true

      - name: Upload hardened audit reports
        uses: actions/upload-artifact@v4
        with:
          name: hardened-audit-reports
          path: |
            client/client-audit-full.json
            server/server-audit-production.json
          if-no-files-found: error
          retention-days: 1

      - name: TypeScript check
        working-directory: client
        run: npx tsc --noEmit

      - name: Build application
        working-directory: client
        run: npm run build

      - name: Build Storybook
        working-directory: client
        run: npm run build-storybook

      - name: Check server JavaScript syntax
        working-directory: server
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/messages.js
          node --check middleware/auth.js
          node --check middleware/validators.js
          node --check models/User.js
          node --check models/Message.js
