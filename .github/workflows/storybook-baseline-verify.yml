name: Verify Storybook TypeScript baseline

on:
  push:
    branches:
      - storybook-typescript-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.22.0"
          - "24.x"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify root lockfile
        run: npm ci --ignore-scripts

      - name: Audit root package
        run: npm audit --omit=dev

      - name: Check root dev launcher syntax
        run: node --check scripts/dev.js

      - name: Install client dependencies from lockfile
        working-directory: client
        run: npm ci

      - name: Run client regression tests
        working-directory: client
        run: npm test -- --watchAll=false --runInBand

      - name: TypeScript check
        working-directory: client
        run: npx tsc --noEmit

      - name: Build application
        working-directory: client
        run: npm run build

      - name: Build Storybook
        working-directory: client
        run: npm run build-storybook

      - name: Capture client audit
        working-directory: client
        run: npm audit --json > client-audit.json || true

      - name: Reject new direct client vulnerabilities
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const audit = JSON.parse(fs.readFileSync("client/client-audit.json", "utf8"));
          const direct = Object.entries(audit.vulnerabilities || {})
            .filter(([name, value]) => value.isDirect && name !== "react-scripts")
            .map(([name, value]) => `${name}:${value.severity}`);
          if (direct.length) {
            console.error(`Unexpected vulnerable direct client dependencies: ${direct.join(", ")}`);
            process.exit(1);
          }
          console.log("No vulnerable direct client dependencies outside the documented CRA 5 exception.");
          NODE

      - name: Install server dependencies from lockfile
        working-directory: server
        run: npm ci

      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Check server JavaScript syntax
        working-directory: server
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/messages.js
          node --check middleware/auth.js
          node --check middleware/validators.js
          node --check models/User.js
          node --check models/Message.js
