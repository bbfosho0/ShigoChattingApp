name: Regenerate Living Sanctuary client lockfile

on:
  push:
    branches:
      - storybook-typescript-baseline

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: storybook-typescript-baseline

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Refresh client package lock
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- client/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git commit -m "chore: refresh client lockfile for Motion"
          git push origin HEAD:storybook-typescript-baseline
